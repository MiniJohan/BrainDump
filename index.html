<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Empty">
  <title>Empty</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service_worker.js');
      });
    }
  </script>
</head>

<body>

    <!-- ─── Login screen ─────────────────────────── -->
    <div id="login-screen">
        <div id="login-box">
            <p id="app-title">Empty</p>
            <input id="email-input"    type="email"    placeholder="your@email.com" autocomplete="email">
            <input id="password-input" type="password" placeholder="password"       autocomplete="current-password">
            <button id="login-btn">continue</button>
            <p id="login-hint"></p>
        </div>
    </div>

    <div id="app-screen" class="hidden">

        <button id="settings-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42
                         M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>

        <div id="input-area">
            <textarea id="input" placeholder="empty anything..." rows="1"></textarea>
            <button id="mic-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="2" width="6" height="11" rx="3"/>
                    <path d="M5 10a7 7 0 0 0 14 0"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                    <line x1="9" y1="22" x2="15" y2="22"/>
                </svg>
            </button>
        </div>

        <div id="thoughts"></div>
    </div>

    <!-- ─── Settings sheet ───────────────────────── -->
    <div id="settings-overlay" class="hidden"></div>

    <div id="settings-sheet" class="hidden">
        <div class="settings-handle"></div>

        <div class="settings-row settings-title">
            <span>settings</span>
            <button id="settings-close">✕</button>
        </div>

        <div class="settings-row">
            <label for="lang-select">voice language</label>
            <select id="lang-select">
                <option value="auto">auto</option>
                <option value="sv-SE">Swedish</option>
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="nb-NO">Norwegian</option>
                <option value="da-DK">Danish</option>
                <option value="fi-FI">Finnish</option>
                <option value="de-DE">German</option>
                <option value="fr-FR">French</option>
                <option value="es-ES">Spanish</option>
            </select>
        </div>

        <div class="settings-row">
            <button id="clear-done-btn" class="settings-action">clear completed</button>
        </div>

        <div class="settings-row">
            <button id="signout-btn" class="settings-action settings-danger">sign out</button>
        </div>
    </div>

    
    <script src="app.js?v=5"></script>
</body>

</html>
